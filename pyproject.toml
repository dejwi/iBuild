
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iBuild"
version = "1.0.0"
dependencies = [
    "attrdict>=2.0.1",
    "diffusers>=0.32.2",
    "einops>=0.8.0",
    "huggingface_hub>=0.28.1",
    "numpy>=2.2.2",
    "Pillow>=11.1.0",
    "timm>=1.0.14",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.48.2",
    "llama_cpp_python>=0.3.7",
    "accelerate",
    "sentencepiece",
    "pyjson5>=1.6.8",
    "sv-ttk>=2.6.0"
]

[tool.pyright]
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."
